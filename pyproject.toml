[project]
name = "rag-ibex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hanser Guzmán", email = "hanser9909@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.4.0",
    "gradio>=6.32.0",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
